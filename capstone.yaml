name: Embeddable Widget & Lead-Capture Platform
run: docker compose up
seed: docker compose exec app python -m app.seed
test: pytest
base_url: http://localhost:8000
endpoints:
  - method: POST
    path: /widgets
    auth: bearer
  - method: GET
    path: /widgets
    auth: bearer
  - method: GET
    path: /widgets/{id}
    auth: bearer
  - method: PUT
    path: /widgets/{id}
    auth: bearer
  - method: DELETE
    path: /widgets/{id}
    auth: bearer
  - method: GET
    path: /widgets/{id}/embed
    auth: bearer
  - method: GET
    path: /widget.v1.js
    auth: none
  - method: GET
    path: /widgets/{id}/config
    auth: none
  - method: POST
    path: /submissions
    auth: none
  - method: GET
    path: /dashboard/submissions
    auth: bearer
  - method: GET
    path: /dashboard/stats
    auth: bearer
